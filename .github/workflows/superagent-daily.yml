name: Superagent Daily Tech & AI News

on:
  schedule:
    - cron: '0 10 * * *'  # 06:00 America/Caracas = 10:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install feedparser requests python-dateutil

      - name: Generate daily summaries
        id: generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python .github/scripts/generate_summaries.py

      - name: Commit summaries
        run: |
          DATE=$(date -u +"%Y-%m-%d")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "summaries/$DATE/"
          git commit -m "Add daily summaries for $DATE" || echo "No changes to commit"
          git push

      - name: Create daily issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const regions = ['USA', 'China', 'Europe', 'Venezuela'];
            const langs = ['en', 'es'];
            let body = `## Daily Tech & AI Trending News - ${date}\n\n`;
            for (const region of regions) {
              body += `### ${region}\n`;
              for (const lang of langs) {
                const label = lang === 'en' ? 'English' : 'Spanish';
                body += `- ${label}: summaries/${date}/${region}_top5_${lang}.md\n`;
              }
              body += '\n';
            }
            body += 'Auto-generated by superagent pipeline.';
            
            await github.rest.issues.create({
              owner: 'lalove1005',
              repo: 'news-superagent-tech-ai',
              title: `News Digest ${date} - Tech & AI Trending`,
              body: body,
              labels: ['news', 'superagent', 'daily']
            });

  monthly-backup:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '0 13 1 * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create monthly archive
        run: |
          PREV_MONTH=$(date -u -d "last month" +"%Y-%m")
          tar -czf "news-backup-${PREV_MONTH}.tar.gz" "summaries/${PREV_MONTH}-*"
          echo "Created backup: news-backup-${PREV_MONTH}.tar.gz"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: monthly-backup-${{ env.PREV_MONTH }}
          path: news-backup-*.tar.gz
          retention-days: 365